appId: com.ringwatch.desktop
productName: RingWatch
copyright: Copyright © 2026 RingWatch
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
  - "!node_modules/ffmpeg-for-homebridge/.build/**"
asarUnpack:
  - "**/ffmpeg-for-homebridge/**"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  artifactName: "${productName}-Setup-${version}-win-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RingWatch
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: "${productName}-Portable-${version}-win-${arch}.${ext}"
