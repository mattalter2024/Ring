name: Build RingWatch Web & Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (Web + Backend)
        run: npm run typecheck

      - name: Run unit & API integration tests
        run: npm test

      - name: Build Web Frontend & Node.js Backend
        run: npm run build

      - name: Compile Windows Service (RingWatchService.exe) & Taskbar Tray Icon (RingWatchTray.exe)
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            throw "Could not find .NET Framework csc.exe at $csc"
          }
          New-Item -ItemType Directory -Force -Path "release/native" | Out-Null

          & $csc /nologo /optimize /target:exe `
            /out:"release\native\RingWatchService.exe" `
            /win32icon:"build\icon.ico" `
            /r:System.ServiceProcess.dll `
            /r:System.Web.Extensions.dll `
            "windows\RingWatchService.cs"
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile RingWatchService.exe" }

          & $csc /nologo /optimize /target:winexe `
            /out:"release\native\RingWatchTray.exe" `
            /win32icon:"build\icon.ico" `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            /r:System.ServiceProcess.dll `
            /r:System.Web.Extensions.dll `
            "windows\RingWatchTray.cs"
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile RingWatchTray.exe" }

          Write-Host "Compiled RingWatchService.exe and RingWatchTray.exe cleanly." -ForegroundColor Green

      - name: Package self-contained Windows Web + NVR Backend ZIP (includes node.exe, service & tray icon)
        shell: pwsh
        run: |
          # Prune devDependencies so only production runtime deps (ring-client-api, ffmpeg.exe, etc.) are bundled
          npm prune --omit=dev

          $stage = "release/RingWatch-Server"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage/runtime" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/build" | Out-Null

          $nodeSrc = (Get-Command node).Source
          Copy-Item $nodeSrc "$stage/runtime/node.exe"
          Copy-Item "release/native/RingWatchService.exe" "$stage/RingWatchService.exe"
          Copy-Item "release/native/RingWatchTray.exe" "$stage/RingWatchTray.exe"
          Copy-Item "build/icon.ico" "$stage/build/icon.ico"
          Copy-Item -Recurse dist "$stage/dist"
          Copy-Item -Recurse dist-server "$stage/dist-server"
          Copy-Item -Recurse node_modules "$stage/node_modules"
          Copy-Item package.json, start-ringwatch.bat, install-windows-service.bat, uninstall-windows-service.bat, install-windows-service.ps1, README.md $stage

          # Smoke-test the self-contained bundle using ONLY its bundled runtime/node.exe
          $smokeData = Join-Path $env:TEMP "ringwatch-ci-smoke"
          if (Test-Path $smokeData) { Remove-Item -Recurse -Force $smokeData }
          $env:PORT = "13456"
          $env:HOST = "127.0.0.1"
          $env:RINGWATCH_DATA_DIR = $smokeData
          $env:RINGWATCH_RECORDINGS_DIR = Join-Path $smokeData "recordings"
          $proc = Start-Process -FilePath (Resolve-Path "$stage/runtime/node.exe") `
            -ArgumentList "dist-server\server\index.js" `
            -WorkingDirectory (Resolve-Path $stage) `
            -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 300
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:13456/api/health" -TimeoutSec 2
                if ($resp.ok -eq $true) {
                  $html = (Invoke-WebRequest -Uri "http://127.0.0.1:13456/" -UseBasicParsing -TimeoutSec 2).Content
                  if ($html -match "RingWatch") {
                    Write-Host "Self-contained Windows smoke test PASSED!" -ForegroundColor Green
                    $ok = $true
                    break
                  }
                }
              } catch {}
            }
            if (-not $ok) {
              throw "Self-contained Windows bundle failed smoke test!"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Recurse -Force $smokeData -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "release/RingWatch-Windows-Server.zip" -Force

      - name: Upload Windows Server Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RingWatch-Windows-Server
          path: release/RingWatch-Windows-Server.zip
          if-no-files-found: error
