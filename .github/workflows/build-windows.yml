name: Build RingWatch Web & Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (Web + Backend)
        run: npm run typecheck

      - name: Run unit & API integration tests
        run: npm test

      - name: Build Web Frontend & Node.js Backend
        run: npm run build

      - name: Package standalone Windows Web + NVR Backend ZIP
        shell: pwsh
        run: |
          $stage = "release/RingWatch-Server"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse dist "$stage/dist"
          Copy-Item -Recurse dist-server "$stage/dist-server"
          Copy-Item package.json, package-lock.json, start-ringwatch.bat, install-windows-startup.ps1, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "release/RingWatch-Windows-Server.zip" -Force

      - name: Upload Windows Server Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RingWatch-Windows-Server
          path: release/RingWatch-Windows-Server.zip
          if-no-files-found: error
