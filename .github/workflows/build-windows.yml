name: Build RingWatch Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Windows NSIS installer & Portable EXE
        run: npm run build:win

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: RingWatch-Windows-Installers
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
